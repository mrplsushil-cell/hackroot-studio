services:
  - type: web
    name: hackroot-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://hackroot-backend.onrender.com

  - type: web
    name: hackroot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips=*
    disks:
      - name: hackroot-storage
        mountPath: /data/storage
        sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Hackroot Studio
      - key: APP_DEBUG
        value: "false"
      - key: FRONTEND_BASE_URL
        value: https://hackroot-frontend.onrender.com
      - key: APP_SECRET_KEY
        sync: false
        value: CHANGE_ME_app_secret_32_byte_hex
      - key: JWT_SECRET
        sync: false
        value: CHANGE_ME_jwt_secret_32_byte_hex
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "1440"
      - key: DATABASE_URL
        fromDatabase:
          name: hackroot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hackroot-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: hackroot-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: hackroot-redis
          type: redis
          property: connectionString
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: /data/storage
      - key: LLM_PROVIDER
        value: mock
      - key: IMAGE_PROVIDER
        value: mock
      - key: VIDEO_PROVIDER
        value: mock
      - key: MUSIC_PROVIDER
        value: mock
      - key: TTS_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: https://hackroot-frontend.onrender.com,https://hackroot-backend.onrender.com

  - type: worker
    name: hackroot-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    startCommand: celery -A app.jobs.celery_app worker --loglevel=info
    disks:
      - name: hackroot-worker-storage
        mountPath: /data/storage
        sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_SECRET_KEY
        sync: false
        value: CHANGE_ME_app_secret_32_byte_hex
      - key: JWT_SECRET
        sync: false
        value: CHANGE_ME_jwt_secret_32_byte_hex
      - key: DATABASE_URL
        fromDatabase:
          name: hackroot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hackroot-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: hackroot-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: hackroot-redis
          type: redis
          property: connectionString
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: /data/storage
      - key: LLM_PROVIDER
        value: mock
      - key: IMAGE_PROVIDER
        value: mock
      - key: VIDEO_PROVIDER
        value: mock
      - key: MUSIC_PROVIDER
        value: mock
      - key: TTS_PROVIDER
        value: mock

  - type: postgres
    name: hackroot-db
    version: 16
    databaseName: hackroot
    user: hackroot
    password: CHANGE_ME_db_password
    plan: starter
    disk:
      name: hackroot-db-data
      sizeGB: 10

  - type: redis
    name: hackroot-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
