# =============================================================================
# Hackroot Studio - Render Blueprint (current dashboard-compatible schema)
# -----------------------------------------------------------------------------
# SERVICES DECLARED (only types the dashboard accepts):
#   - hackroot-frontend  (web)     Next.js production server
#   - hackroot-backend   (web)     FastAPI + Uvicorn (Alembic pre-deploy)
#   - hackroot-worker    (worker)  Celery worker
#
# Database & Redis are NOT declared here. The dashboard rejects `type: postgres`
# and `type: redis` for this account, so the managed Postgres/Redis are created
# separately on Render, and these services consume them via `fromDatabase` /
# `fromService` env-var references (bindings, not service declarations).
#
# Before deploying:
#   1. Create a Postgres service named `hackroot-db` on Render (or rename the
#      `fromDatabase.name` below to match your existing Postgres service).
#   2. Create a Redis service named `hackroot-redis` (or rename `fromService.name`).
#   3. Set APP_SECRET_KEY / JWT_SECRET to real values (`openssl rand -hex 32`).
#   4. Paste the async DB URL into DATABASE_URL if your Postgres connection
#      string is `postgres://...` and the app needs `postgresql+asyncpg://...`
#      (see backend/app/config.py - set DATABASE_URL accordingly).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Frontend (Next.js production)
  # ---------------------------------------------------------------------------
  - type: web
    name: hackroot-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://hackroot-backend.onrender.com

  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  - type: web
    name: hackroot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Hackroot Studio
      - key: APP_DEBUG
        value: "false"
      - key: FRONTEND_BASE_URL
        value: https://hackroot-frontend.onrender.com
      - key: APP_SECRET_KEY
        value: CHANGE_ME_app_secret_32_byte_hex
      - key: JWT_SECRET
        value: CHANGE_ME_jwt_secret_32_byte_hex
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "1440"
      - key: DATABASE_URL
        fromDatabase:
          name: hackroot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hackroot-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: hackroot-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: hackroot-redis
          type: redis
          property: connectionString
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: /data/storage
      - key: LLM_PROVIDER
        value: mock
      - key: IMAGE_PROVIDER
        value: mock
      - key: VIDEO_PROVIDER
        value: mock
      - key: MUSIC_PROVIDER
        value: mock
      - key: TTS_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: https://hackroot-frontend.onrender.com,https://hackroot-backend.onrender.com

  # ---------------------------------------------------------------------------
  # Celery Worker (same backend image)
  # ---------------------------------------------------------------------------
  - type: worker
    name: hackroot-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_SECRET_KEY
        value: CHANGE_ME_app_secret_32_byte_hex
      - key: JWT_SECRET
        value: CHANGE_ME_jwt_secret_32_byte_hex
      - key: DATABASE_URL
        fromDatabase:
          name: hackroot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hackroot-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: hackroot-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: hackroot-redis
          type: redis
          property: connectionString
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: /data/storage
      - key: LLM_PROVIDER
        value: mock
      - key: IMAGE_PROVIDER
        value: mock
      - key: VIDEO_PROVIDER
        value: mock
      - key: MUSIC_PROVIDER
        value: mock
      - key: TTS_PROVIDER
        value: mock
