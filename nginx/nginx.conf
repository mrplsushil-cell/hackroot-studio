# =============================================================================
# Hackroot Studio — nginx reverse proxy (production)
# =============================================================================
# - Terminates TLS when certs are mounted (HTTPS-ready; see ssl_certificate).
# - HTTP -> HTTPS redirect (enabled).
# - Gzip + Brotli compression.
# - Static-asset + media caching.
# - Security headers + HSTS.
# - App-level rate limiting (FastAPI ALSO enforces per-IP limits).
# - Proxies /api/* -> backend, /media/* -> backend storage, rest -> frontend.
#
# Image: nginxinc/nginx-brotli (includes the Brotli module). If you must use
# the stock nginx:1.27-alpine, comment out the `brotli_*` directives below.
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

# Load Brotli dynamic module (installed in the brotli-enabled nginx image).
load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;                       # hide nginx version

    # ---- Logging (easy to ship) ----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct="$upstream_connect_time"';
    access_log  /var/log/nginx/access.log main;

    # ---- Gzip ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml application/x-javascript image/svg+xml font/woff2;

    # ---- Brotli ----
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types
        text/plain text/css application/json application/javascript
        application/xml image/svg+xml font/woff2 application/x-font-ttf;

    # ---- Rate limiting (defence in depth; FastAPI also limits) ----
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

    # ---- Upstreams ----
    upstream backend_upstream {
        server backend:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }
    upstream frontend_upstream {
        server frontend:3000 max_fails=3 fail_timeout=15s;
    }

    # Client upload ceiling (brand-kit logos allow up to 50 MB).
    client_max_body_size 50m;
    client_body_timeout   60s;

    # ---- HTTP -> HTTPS redirect ----
    server {
        listen 80;
        server_name _;
        # ACME http-01 challenge must stay on port 80 (no redirect).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS ----
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS (only after TLS is confirmed working).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ACME challenge over HTTPS too (harmless).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /health {
            proxy_pass http://backend_upstream/health;
            access_log off;
        }

        # API -> backend
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host   $host;
            proxy_read_timeout 300s;          # long video renders
            proxy_send_timeout 300s;
        }

        # Auth endpoints: stricter limit
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Served media (rendered MP4s + thumbnails + uploaded assets)
        location /media/ {
            proxy_pass http://backend_upstream/media/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # Next.js static build assets (long immutable cache)
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }

        # Everything else -> frontend (SPA)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Security headers on every response ----
        add_header X-Content-Type-Options    "nosniff"              always;
        add_header X-Frame-Options           "SAMEORIGIN"           always;
        add_header X-XSS-Protection          "1; mode=block"        always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy    "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; frame-ancestors 'self';" always;
    }
}
